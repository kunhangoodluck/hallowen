<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Halloween AI 關主（Azure 發音評分版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b2b;--panel:#1a1747;--accent:#ff7a1a;--good:#5ce07a;--ok:#ffd93b;--bad:#ff6b6b;--text:#fff;--dim:#9b97c9;--azure:#3aa0ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#2a2470 0%,var(--bg) 60%);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px;}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  h1{margin:0;font-size:32px;color:var(--accent);letter-spacing:3px;text-shadow:0 0 18px #ff7a1a88;}
  .badge{display:inline-block;margin-left:10px;font-size:14px;letter-spacing:0;padding:3px 10px;border-radius:999px;background:var(--azure);color:#fff;vertical-align:middle;text-shadow:none;}
  #count{font-size:20px;color:var(--dim);white-space:nowrap;}
  #count b{color:var(--good);font-size:28px;}
  #gear{background:#ffffff18;box-shadow:none;padding:8px 14px;font-size:26px;flex:none;border-radius:12px;}
  #needKey{flex:none;display:none;background:var(--azure);box-shadow:0 6px 0 #1b5ea3;font-size:22px;padding:16px;}
  #needKey.show{display:block;}
  #poem{flex:1;background:var(--panel);border-radius:20px;padding:22px 26px;overflow:auto;box-shadow:0 0 30px #0008 inset;}
  .line{font-size:33px;line-height:1.55;margin:4px 0;font-weight:700;}
  .w{transition:color .25s,text-shadow .25s;color:#d9d6ff;}
  .w.good{color:var(--good);text-shadow:0 0 14px #5ce07a99;}
  .w.ok{color:var(--ok);}
  .w.bad{color:var(--bad);}
  #status{min-height:64px;background:#00000040;border-radius:14px;padding:10px 16px;font-size:22px;display:flex;align-items:center;gap:12px;}
  #mic{width:16px;height:16px;border-radius:50%;background:#555;flex:none;}
  #mic.on{background:#ff3b3b;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
  #heard{color:var(--dim);font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #bar{height:14px;background:#00000060;border-radius:7px;overflow:hidden;}
  #fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .3s;}
  #btns{display:flex;gap:12px;}
  button{flex:1;border:none;border-radius:16px;padding:20px 10px;font-size:26px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
  #start{background:var(--accent);box-shadow:0 6px 0 #b24f00;}
  #start.listening{background:#c0392b;box-shadow:0 6px 0 #7a1d14;}
  #demo{background:#4c47a8;box-shadow:0 6px 0 #2b2868;flex:.6;}
  #pass{background:var(--good);color:#0d0b2b;box-shadow:0 6px 0 #2f8a46;flex:.6;}
  button:active{transform:translateY(4px);box-shadow:none;}
  .modal{position:fixed;inset:0;background:#0d0b2bf2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;z-index:10;}
  .modal.show{display:flex;}
  #overlay .big{font-size:110px;}
  #overlay .msg{font-size:46px;font-weight:800;color:var(--good);}
  #overlay .sub{font-size:28px;}
  #overlay .cn{font-size:24px;color:var(--dim);}
  .stars{font-size:54px;letter-spacing:6px;}
  .scores{display:flex;gap:30px;font-size:20px;color:var(--dim);}
  .scores b{display:block;font-size:34px;color:#fff;}
  .modal button{flex:none;width:260px;background:var(--accent);box-shadow:0 6px 0 #b24f00;}
  #setup h2{margin:0;font-size:30px;color:var(--azure);}
  #setup input,#setup select{width:min(520px,90vw);font-size:20px;padding:14px;border-radius:10px;border:none;font-family:inherit;}
  #setup label{color:var(--dim);font-size:18px;margin-top:6px;}
  #setup .note{color:var(--dim);font-size:16px;max-width:520px;line-height:1.5;}
  #setup .row{display:flex;gap:14px;margin-top:8px;}
  #closeSetup{background:#4c47a8 !important;box-shadow:0 6px 0 #2b2868 !important;}
  .confetti{position:fixed;top:-20px;width:12px;height:18px;animation:fall linear forwards;pointer-events:none;z-index:20;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

  /* ===== 海報風格大字幕 ===== */
  #poem{display:flex;flex-direction:column;justify-content:safe center;align-items:center;text-align:center;
        padding:2vh 3vw;font-family:"Fredoka","Arial Rounded MT Bold","PingFang TC",sans-serif;
        background:radial-gradient(circle at 50% -30%,#8a86b8 0%,#4b4785 16%,transparent 34%),linear-gradient(180deg,#1c1850,#15123f);}
  .ptitle{font-family:"Fredoka","Arial Rounded MT Bold",sans-serif;font-weight:700;color:#e8463a;
          font-size:clamp(30px,min(6.5vw,7vh),92px);letter-spacing:2px;line-height:1;margin-bottom:1.6vh;text-shadow:0 3px 0 #00000055;}
  .line{font-size:clamp(20px,min(4.15vw,4.9vh),66px)!important;line-height:1.3!important;margin:.5vh 0!important;font-weight:600!important;}
  .w{color:#ffffff!important;text-shadow:0 2px 0 #00000055;}
  .w.hit,.w.good{color:#5ce07a!important;text-shadow:0 0 18px #5ce07aaa!important;}
  .w.ok{color:#ffd93b!important;}
  .w.bad{color:#ff6b6b!important;}
  h1{font-size:22px!important;}

  /* ===== 南瓜燈 ===== */
  #poem{position:relative;}
  .jack{position:absolute;bottom:1.2vh;width:clamp(80px,min(13vw,17vh),190px);pointer-events:none;z-index:0;
        filter:drop-shadow(0 0 calc(var(--lit,0)*28px) rgba(255,170,40,calc(var(--lit,0)*.9)));transition:filter .4s;}
  .jack.l{left:1.5vw;transform:rotate(-6deg);} .jack.r{right:1.5vw;transform:rotate(6deg) scaleX(-1);}
  .jack .face{fill:#ffd23b;opacity:calc(.12 + var(--lit,0)*.88);transition:opacity .4s;}
  .jack.full .face{animation:flicker 1.1s infinite;}
  @keyframes flicker{0%,100%{opacity:1}40%{opacity:.75}55%{opacity:.95}70%{opacity:.65}}
  .ptitle,.line{position:relative;z-index:1;}
  #bar{position:relative;overflow:visible!important;}
  #fill{background:linear-gradient(90deg,#c2410c,#ff7a1a,#ffb347)!important;border-radius:7px;}
  #runner{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:30px;transition:left .3s;pointer-events:none;}
  .bigjack{width:min(240px,32vh);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both,bob 1.6s .6s ease-in-out infinite;
           filter:drop-shadow(0 0 30px rgba(255,170,40,.9));}
  .bigjack .face{fill:#ffd23b;animation:flicker 1.1s infinite;}
  @keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  @media (max-aspect-ratio:1/1){ .jack{width:clamp(80px,22vw,200px);bottom:2vh;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎃 萬聖節闖關<span class="badge">Azure 評分版</span></h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="count">已過關 <b id="n">0</b> 人</div>
      <button id="gear" aria-label="設定">⚙️</button>
    </div>
  </header>
  <button id="needKey">🔑 還沒設定 Azure 金鑰，點這裡設定</button>
  <div id="poem"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="status"><div id="mic"></div><div id="heard">載入中…</div></div>
  <div id="btns">
    <button id="demo">🔊 範讀</button>
    <button id="start">🎤 開始念</button>
    <button id="pass">✅ 直接過關</button>
  </div>
</div>

<div id="overlay" class="modal">
  <div class="big">🍬👻🍬</div>
  <div class="stars" id="stars">⭐⭐⭐</div>
  <div class="msg" id="ovMsg">Great job!</div>
  <div class="sub" id="ovSub">You did it!</div>
  <div class="scores">
    <div>發音 <b id="sAcc">-</b></div>
    <div>完整 <b id="sComp">-</b></div>
    <div>流暢 <b id="sFlu">-</b></div>
  </div>
  <div class="cn">念完了，去領糖果吧！</div>
  <button id="next">下一位 ▶</button>
</div>

<div id="setup" class="modal">
  <h2>⚙️ Azure Speech 設定</h2>
  <label for="key">金鑰（Key 1）</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="長按 → 貼上 Azure 的金鑰 1">
  <label for="region">區域（Region）</label>
  <select id="region">
    <option value="eastasia">eastasia（東亞／香港）</option>
    <option value="japaneast">japaneast</option>
    <option value="southeastasia">southeastasia</option>
    <option value="eastus">eastus</option>
    <option value="westus2">westus2</option>
  </select>
  <div class="note">金鑰只存在這台 iPad 的 Safari 裡，不會寫進網頁檔案，也不會上傳到 GitHub。<br>Azure 入口網站 → 你的語音服務 → 「金鑰與端點」可以找到。</div>
  <div class="row">
    <button id="saveKey">儲存</button>
    <button id="closeSetup">取消</button>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const LINES = [
  "Ghosts and goblins, glowing giant green,",
  "Spooky spiders spinning webs | that can't be seen.",
  "Giant monsters giggling behind the screen,",
  "Trick or treat! Bring out the sweet jellybean!",
  "Give me great goodies, good and supreme,",
  "Or I'll scare you running down the street | with a scream!"
];
const REFERENCE = LINES.join(' ').replace(/ \| /g,' ');
const PASS_COMPLETE = 0.7;   // 整首至少念到 70% 的字
const LAST_LINE_NEED = 3;    // 最後一句至少念到 3 個字才算念完
const LOOKAHEAD = 8;         // 對字時最多往後跳幾個字（容許漏念）
const FINISH_DELAY = 1500;   // 判定念完後多等 1.5 秒
const SILENCE_SEC = 15;      // 15 秒沒有進度就結算
const CHEERS = {
  3:[["Excellent!","Your English is amazing!"],["Perfect!","You sound like a real ghost!"],["Wonderful!","Happy Halloween, superstar!"]],
  2:[["Great job!","You did it!"],["Awesome!","You scared all the ghosts away!"],["Super!","Go get your candy!"]],
  1:[["Nice try!","You were so brave to read it!"],["Good effort!","Keep practicing, you're doing great!"]]
};

/* ===== 安全的 localStorage ===== */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(_){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}

/* ===== 建立字詞 ===== */
function norm(s){return s.toLowerCase().replace(/[^a-z']/g,'').replace(/'/g,'');}
const poemEl=document.getElementById('poem');
{const t=document.createElement('div');t.className='ptitle';t.textContent='HALLOWEEN';poemEl.appendChild(t);}
const words=[];   // {token, el, score, line}
LINES.forEach((line,li)=>{
  const div=document.createElement('div');div.className='line';
  let first=true;
  line.split(' ').forEach((raw)=>{
    if(raw==='|'){div.appendChild(document.createElement('br'));first=true;return;}
    const i=first?0:1; first=false;
    const span=document.createElement('span');span.className='w';span.textContent=(i?' ':'')+raw;
    const token=norm(raw); if(token) words.push({token,el:span,score:null,line:li});
    div.appendChild(span);
  });
  poemEl.appendChild(div);
});

/* ===== 元件 ===== */
const $=id=>document.getElementById(id);
const fill=$('fill'), heard=$('heard'), mic=$('mic'), startBtn=$('start'), nEl=$('n'),
      setup=$('setup'), needKey=$('needKey');
let listening=false, recognizer=null, lastProgress=0, timer=null, passed=false,
    cursor=0, fluencySum=0, fluencyN=0, finishTimer=null;
let count=parseInt(lsGet('hw_count','0'))||0; nEl.textContent=count;

/* ===== 金鑰設定 ===== */
function getCfg(){return {key:lsGet('az_key',''),region:lsGet('az_region','eastasia')};}
function refreshKeyHint(){
  const has=!!getCfg().key;
  needKey.classList.toggle('show',!has);
  if(!listening) heard.textContent=has?'按「開始念」然後對著麥克風念出來！':'請先按上方藍色按鈕設定金鑰';
}
function openSetup(){
  const c=getCfg(); $('key').value=c.key; $('region').value=c.region;
  setup.classList.add('show');
}
$('gear').onclick=openSetup;
needKey.onclick=openSetup;
$('saveKey').onclick=()=>{
  const k=$('key').value.replace(/\s+/g,'');
  if(k.length<20){alert('金鑰看起來不完整，請重新複製「金鑰 1」再貼上。');return;}
  lsSet('az_key',k); lsSet('az_region',$('region').value);
  setup.classList.remove('show'); refreshKeyHint();
  heard.textContent='✅ 設定已儲存，可以開始了！';
};
$('closeSetup').onclick=()=>setup.classList.remove('show');

/* ===== 載入 Azure SDK（失敗會顯示原因） ===== */
let sdkReady=false;
(function loadSDK(){
  const urls=[
    'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js',
    'https://unpkg.com/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js'
  ];
  let i=0;
  function tryNext(){
    if(i>=urls.length){heard.textContent='❌ Azure 元件下載失敗，請確認網路後重新整理';return;}
    const s=document.createElement('script'); s.src=urls[i++];
    s.onload=()=>{ if(window.SpeechSDK){sdkReady=true;refreshKeyHint();} else tryNext(); };
    s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();

/* ===== 把 Azure 回傳的字對到詩句上 ===== */
function applyWords(azWords){
  let changed=false;
  azWords.forEach(aw=>{
    const t=norm(aw.Word||''); if(!t) return;
    const pa=aw.PronunciationAssessment||{};
    if(pa.ErrorType==='Insertion'||pa.ErrorType==='Omission') return;
    for(let i=cursor;i<Math.min(cursor+LOOKAHEAD,words.length);i++){
      if(words[i].score===null && words[i].token===t){
        const s=(typeof pa.AccuracyScore==='number')?pa.AccuracyScore:0;
        words[i].score=s;
        words[i].el.classList.add(s>=80?'good':s>=60?'ok':'bad');
        for(let j=cursor;j<i;j++) if(words[j].score===null) words[j].score=-1; // 漏念
        cursor=i+1; changed=true; break;
      }
    }
  });
  if(changed) lastProgress=Date.now();
  const read=words.filter(w=>w.score!==null&&w.score>=0);
  fill.style.width=(read.length/words.length*100)+'%';
  const lastLine=LINES.length-1;
  const lastHits=read.filter(w=>w.line===lastLine).length;
  if(!passed && !finishTimer &&
     (cursor>=words.length || (read.length/words.length>=PASS_COMPLETE && lastHits>=LAST_LINE_NEED))){
    finishTimer=setTimeout(()=>{finishTimer=null; if(listening) finish(false);},FINISH_DELAY);
  }
}

/* ===== 開始 / 停止 ===== */
function startListening(){
  const {key,region}=getCfg();
  if(!sdkReady){alert('Azure 元件還沒載入完成，請稍等幾秒或重新整理。');return;}
  if(!key){openSetup();return;}
  resetWords();
  try{
    const cfg=SpeechSDK.SpeechConfig.fromSubscription(key,region);
    cfg.speechRecognitionLanguage='en-US';
    cfg.setProperty(SpeechSDK.PropertyId.Speech_SegmentationSilenceTimeoutMs,'1200');
    const audio=SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
    recognizer=new SpeechSDK.SpeechRecognizer(cfg,audio);
    const pa=new SpeechSDK.PronunciationAssessmentConfig(
      REFERENCE,
      SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
      SpeechSDK.PronunciationAssessmentGranularity.Word,
      true);
    pa.applyTo(recognizer);
  }catch(err){heard.textContent='❌ 無法建立辨識：'+err;return;}

  recognizer.recognizing=(s,e)=>{ if(e.result&&e.result.text) heard.textContent='🎧 '+e.result.text; };
  recognizer.recognized=(s,e)=>{
    if(e.result.reason!==SpeechSDK.ResultReason.RecognizedSpeech) return;
    try{
      const j=JSON.parse(e.result.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult));
      const nb=j.NBest&&j.NBest[0]; if(!nb) return;
      const p=nb.PronunciationAssessment;
      if(p&&typeof p.FluencyScore==='number'){fluencySum+=p.FluencyScore;fluencyN++;}
      applyWords(nb.Words||[]);
    }catch(err){console.error(err);}
  };
  recognizer.canceled=(s,e)=>{
    if(e.reason===SpeechSDK.CancellationReason.Error){
      const d=(e.errorDetails||'');
      let msg='❌ Azure 錯誤：'+d.slice(0,80);
      if(/401|unauthori|forbidden|403/i.test(d)) msg='❌ 金鑰錯誤或區域不對，請按 ⚙️ 重新設定';
      else if(/1006|websocket|network/i.test(d)) msg='❌ 連不到 Azure，請檢查網路';
      heard.textContent=msg; stopListening();
    }
  };
  recognizer.startContinuousRecognitionAsync(()=>{},err=>{heard.textContent='❌ 無法啟動：'+err;stopListening();});

  listening=true; passed=false; lastProgress=Date.now();
  mic.classList.add('on'); startBtn.textContent='⏹ 念完了'; startBtn.classList.add('listening');
  heard.textContent='我在聽囉… Go!（每念完一句稍微停一下）';
  speak('Ready? Go!');
  timer=setInterval(()=>{
    if(!listening||passed||finishTimer) return;
    const idle=Date.now()-lastProgress;
    if(cursor>0 && idle>SILENCE_SEC*1000) finish(false);
    else if(cursor===0 && idle>SILENCE_SEC*2000) finish(false);
  },500);
}
function stopListening(){
  listening=false; clearInterval(timer);
  if(recognizer){const r=recognizer;recognizer=null;
    try{r.stopContinuousRecognitionAsync(()=>r.close(),()=>r.close());}catch(_){}}
  mic.classList.remove('on'); startBtn.textContent='🎤 開始念'; startBtn.classList.remove('listening');
}
function resetWords(){
  clearTimeout(finishTimer); finishTimer=null;
  words.forEach(w=>{w.score=null;w.el.className='w';});
  fill.style.width='0'; cursor=0; fluencySum=0; fluencyN=0;
}

/* ===== 過關與評分 ===== */
function finish(manual){
  if(passed) return; passed=true; stopListening();
  const read=words.filter(w=>w.score!==null&&w.score>=0);
  const completeness=read.length/words.length;
  const accuracy=read.length?read.reduce((a,w)=>a+w.score,0)/read.length:0;
  const fluency=fluencyN?fluencySum/fluencyN:0;
  let tier;
  if(manual) tier=2;
  else if(completeness>=0.85 && accuracy>=75) tier=3;
  else if(completeness>=PASS_COMPLETE) tier=2;
  else tier=1;
  const pool=CHEERS[tier]; const [a,b]=pool[Math.floor(Math.random()*pool.length)];
  $('stars').textContent='⭐'.repeat(tier)+'☆'.repeat(3-tier);
  $('ovMsg').textContent=a; $('ovSub').textContent=b;
  $('sAcc').textContent=manual?'-':Math.round(accuracy);
  $('sComp').textContent=manual?'-':Math.round(completeness*100)+'%';
  $('sFlu').textContent=manual?'-':Math.round(fluency);
  $('overlay').classList.add('show');
  count++; lsSet('hw_count',count); nEl.textContent=count;
  confetti(); speak(a+' '+b);
}
$('next').onclick=()=>{$('overlay').classList.remove('show');resetWords();passed=false;refreshKeyHint();};
$('pass').onclick=()=>finish(true);
startBtn.onclick=()=>listening?finish(false):startListening();

/* ===== 範讀 / 語音 ===== */
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Ava|Allison/i.test(v.name))
      ||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate=0.9){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}
$('demo').onclick=()=>{if(listening)stopListening();speak(REFERENCE,0.8);};

/* ===== 彩帶 ===== */
function confetti(){
  const colors=['#ff7a1a','#5ce07a','#a86bff','#ffd93b','#fff'];
  for(let i=0;i<90;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000);
  }
}
/* 長按人數歸零 */
let pressT;
nEl.parentElement.addEventListener('touchstart',()=>{pressT=setTimeout(()=>{if(confirm('把過關人數歸零？')){count=0;lsSet('hw_count',0);nEl.textContent=0;}},1500);});
nEl.parentElement.addEventListener('touchend',()=>clearTimeout(pressT));

/* ===== 啟動 ===== */
refreshKeyHint();
if(!getCfg().key) openSetup();

/* ===== 南瓜燈：跟著進度發光 ===== */
(function(){
  const SVG='<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg"><path d="M96 34c-2-14 4-24 14-28l6 6c-8 4-11 11-10 22z" fill="#3f7d2e"/><path d="M112 14c14-8 28-4 34 6-12-2-22 0-30 6z" fill="#5aa13d"/><ellipse cx="62" cy="104" rx="52" ry="66" fill="#d9590f"/><ellipse cx="138" cy="104" rx="52" ry="66" fill="#d9590f"/><ellipse cx="100" cy="102" rx="54" ry="72" fill="#f07a16"/><ellipse cx="100" cy="102" rx="26" ry="70" fill="#ff8e2b" opacity=".55"/><path d="M48 48c-14 20-14 92 0 112M152 48c14 20 14 92 0 112" stroke="#b9470a" stroke-width="3" fill="none" opacity=".6"/><g class="face"><path d="M58 80l22-4-8 24z"/><path d="M142 80l-22-4 8 24z"/><path d="M93 104l7-12 7 12z"/><path d="M50 122c16 22 84 22 100 0l-10 6-8-8-10 10-10-9-10 9-10-10-8 8z"/></g></svg>';
  const poem=document.getElementById('poem');
  ['l','r'].forEach(c=>{const d=document.createElement('div');d.className='jack '+c;d.innerHTML=SVG;poem.appendChild(d);});
  const bar=document.getElementById('bar'); const r=document.createElement('div'); r.id='runner'; r.textContent='🎃'; bar.appendChild(r);
  const big=document.querySelector('#overlay .big'); if(big){big.className='bigjack';big.innerHTML=SVG;}
  const fillEl=document.getElementById('fill');
  function sync(){
    const p=Math.max(0,Math.min(100,parseFloat(fillEl.style.width)||0));
    r.style.left=p+'%';
    document.querySelectorAll('.jack').forEach(j=>{j.style.setProperty('--lit',(p/100).toFixed(2));j.classList.toggle('full',p>=70);});
  }
  new MutationObserver(sync).observe(fillEl,{attributes:true,attributeFilter:['style']});
  sync();
  // 過關時重新觸發彈跳動畫
  const ov=document.getElementById('overlay');
  new MutationObserver(()=>{const b=ov.querySelector('.bigjack');if(b&&ov.classList.contains('show')){b.style.animation='none';void b.offsetWidth;b.style.animation='';}}).observe(ov,{attributes:true,attributeFilter:['class']});
})();
</script>
