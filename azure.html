<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Halloween AI 關主（Azure KTV 版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b2b;--accent:#ff7a1a;--good:#5ce07a;--gold:#ffcf3b;--text:#fff;--dim:#9b97c9;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#2a2470 0%,var(--bg) 60%);color:var(--text);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;padding:14px 16px 16px;gap:12px;}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  h1{margin:0;font-size:22px;color:var(--accent);letter-spacing:2px;}
  #mode{display:flex;background:#00000050;border-radius:14px;padding:4px;gap:4px;}
  #mode button{flex:none;padding:10px 18px;font-size:20px;border-radius:10px;background:transparent;box-shadow:none;color:var(--dim);}
  #mode button.on{background:var(--accent);color:#fff;}
  #count{font-size:20px;color:var(--dim);white-space:nowrap;}
  #count b{color:var(--good);font-size:28px;}

  /* ===== 舞台 ===== */
  #poem{flex:1;position:relative;border-radius:20px;overflow:hidden;box-shadow:0 0 30px #0008 inset;
    background:radial-gradient(circle at 50% -30%,#8a86b8 0%,#4b4785 16%,transparent 34%),linear-gradient(180deg,#1c1850,#15123f);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vh 4vw;
    font-family:"Fredoka","Arial Rounded MT Bold","PingFang TC",sans-serif;}
  .ptitle{font-weight:700;color:#e8463a;font-size:clamp(26px,min(4.5vw,5.5vh),64px);letter-spacing:2px;line-height:1;
    position:absolute;top:2.2vh;left:0;right:0;text-shadow:0 3px 0 #00000055;z-index:1;}
  #counter{position:absolute;top:2.6vh;right:2vw;font-size:clamp(14px,1.8vw,20px);color:var(--dim);z-index:1;font-family:-apple-system,"PingFang TC",sans-serif;}
  #prev{z-index:1;min-height:1em;margin-bottom:5vh;}
  #prev div{font-size:clamp(16px,min(2.6vw,3.6vh),36px);color:var(--gold);opacity:.55;font-weight:600;line-height:1.35;}
  #prev div:first-child:not(:last-child){opacity:.3;}
  #cur{position:relative;z-index:2;font-size:clamp(30px,min(5.6vw,9vh),96px);font-weight:700;line-height:1.55;max-width:100%;}
  #cur.enter{animation:rise .45s ease-out both;}
  @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .w{color:#fff;text-shadow:0 3px 0 #00000066;transition:color .15s,text-shadow .15s;display:inline-block;cursor:pointer;border-radius:.15em;}
  .w.tap{animation:tap .7s ease-out;}
  @keyframes tap{0%{transform:scale(1);background:#7fd3ff00}30%{transform:scale(1.18);background:#7fd3ff55}100%{transform:scale(1);background:#7fd3ff00}}
  #taptip{z-index:1;margin-top:1.2vh;font-size:clamp(14px,min(1.9vw,2.6vh),22px);color:#7fd3ff;opacity:.85;font-family:-apple-system,"PingFang TC",sans-serif;}
  .w.sung{color:var(--gold);text-shadow:0 0 18px #ffb20099,0 3px 0 #00000066;}
  #cur.helping .w{color:#b9b4ff;}
  #ball{position:absolute;font-size:.42em;transform:translate(-50%,-100%);transition:left .25s,top .25s;
        animation:hop .5s ease-in-out infinite alternate;pointer-events:none;}
  @keyframes hop{from{margin-top:0}to{margin-top:-.25em}}
  #hint{z-index:1;margin-top:2.5vh;font-size:clamp(18px,min(2.8vw,4vh),36px);color:var(--dim);min-height:1.3em;font-family:-apple-system,"PingFang TC",sans-serif;font-weight:700;}
  #hint.listen{color:var(--good);} #hint.speak{color:#b9b4ff;}

  /* ===== 南瓜燈 ===== */
  .jack{position:absolute;bottom:1.2vh;width:clamp(70px,min(12vw,16vh),180px);pointer-events:none;z-index:0;
        filter:drop-shadow(0 0 calc(var(--lit,0)*28px) rgba(255,170,40,calc(var(--lit,0)*.9)));transition:filter .4s;}
  .jack.l{left:1.5vw;transform:rotate(-6deg);} .jack.r{right:1.5vw;transform:rotate(6deg) scaleX(-1);}
  .jack .face{fill:#ffd23b;opacity:calc(.12 + var(--lit,0)*.88);transition:opacity .4s;}
  .jack.full .face{animation:flicker 1.1s infinite;}
  @keyframes flicker{0%,100%{opacity:1}40%{opacity:.75}55%{opacity:.95}70%{opacity:.65}}

  /* ===== 下方 ===== */
  #bar{position:relative;height:14px;background:#00000060;border-radius:7px;}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#c2410c,#ff7a1a,#ffb347);border-radius:7px;transition:width .3s;}
  #runner{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:30px;transition:left .3s;pointer-events:none;}
  #status{min-height:56px;background:#00000040;border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:12px;}
  #mic{width:16px;height:16px;border-radius:50%;background:#555;flex:none;}
  #mic.on{background:#ff3b3b;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
  #heard{color:var(--dim);font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #btns{display:flex;gap:12px;}
  button{flex:1;border:none;border-radius:16px;padding:18px 10px;font-size:24px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;}
  #start{background:var(--accent);box-shadow:0 6px 0 #b24f00;}
  #start.listening{background:#c0392b;box-shadow:0 6px 0 #7a1d14;}
  #demo{background:#4c47a8;box-shadow:0 6px 0 #2b2868;flex:.7;}
  #skip{background:#1f8a8a;box-shadow:0 6px 0 #11595a;flex:.6;}
  #skip:disabled{opacity:.35;}
  #pass{background:var(--good);color:#0d0b2b;box-shadow:0 6px 0 #2f8a46;flex:.6;}
  #btns button:active{transform:translateY(4px);box-shadow:none;}

  .badge{display:inline-block;margin-left:8px;font-size:13px;letter-spacing:0;padding:3px 9px;border-radius:999px;background:#3aa0ff;color:#fff;vertical-align:middle;}
  #gear{flex:none;background:#ffffff18;box-shadow:none;padding:6px 12px;font-size:24px;border-radius:12px;}
  #needKey{flex:none;display:none;background:#3aa0ff;box-shadow:0 6px 0 #1b5ea3;font-size:22px;padding:14px;}
  #needKey.show{display:block;}
  /* 萬聖節配色：念到＝金黃，評分後換成 南瓜橘／巫婆紫／史萊姆綠（沒有紅色） */
  .w.good,#prev .w.good{color:#ff9a1f!important;text-shadow:0 0 18px #ff8a00cc,0 3px 0 #00000066!important;}
  .w.ok,#prev .w.ok{color:#c9a4ff!important;text-shadow:0 0 14px #a970ff99,0 3px 0 #00000066!important;}
  .w.bad,#prev .w.bad{color:#9be34a!important;text-shadow:0 0 12px #7ccf2a88,0 3px 0 #00000066!important;}
  #prev .w{display:inline;cursor:default;color:inherit;text-shadow:none;}
  #legend{position:absolute;top:2.4vh;left:2vw;z-index:1;font-size:clamp(12px,1.45vw,17px);color:var(--dim);font-family:-apple-system,"PingFang TC",sans-serif;line-height:1.6;text-align:left;}
  #legend i{font-style:normal;font-weight:800;}
  #setup{position:fixed;inset:0;background:#0d0b2bf2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;z-index:30;}
  #setup.show{display:flex;}
  #setup h2{margin:0;font-size:30px;color:#3aa0ff;}
  #setup input,#setup select{width:min(520px,90vw);font-size:20px;padding:14px;border-radius:10px;border:none;font-family:inherit;}
  #setup label{color:var(--dim);font-size:18px;margin-top:6px;}
  #setup .note{color:var(--dim);font-size:16px;max-width:520px;line-height:1.5;}
  #setup .row{display:flex;gap:14px;margin-top:8px;}
  #setup button{flex:none;width:200px;background:var(--accent);box-shadow:0 6px 0 #b24f00;}
  #setup #closeSetup{background:#4c47a8;box-shadow:0 6px 0 #2b2868;}
  .stars{font-size:50px;letter-spacing:4px;}
  .bonus{display:none;font-size:30px;font-weight:800;color:#2a1600;background:linear-gradient(90deg,#ffd93b,#ffb020,#ffd93b);
         padding:8px 26px;border-radius:999px;box-shadow:0 0 30px #ffc83d99;animation:shine 1.2s ease-in-out infinite alternate;}
  .bonus.show{display:block;}
  @keyframes shine{from{transform:scale(1)}to{transform:scale(1.07)}}
  .scores{display:flex;gap:30px;font-size:20px;color:var(--dim);}
  .scores b{display:block;font-size:34px;color:#fff;}
  /* ===== 過關 ===== */
  #overlay{position:fixed;inset:0;background:#0d0b2bf2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;z-index:10;}
  #overlay.show{display:flex;}
  .bigjack{width:min(240px,32vh);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both,bob 1.6s .6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,170,40,.9));}
  .bigjack .face{fill:#ffd23b;animation:flicker 1.1s infinite;}
  @keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  #overlay .msg{font-size:46px;font-weight:800;color:var(--good);}
  #overlay .sub{font-size:28px;}
  #overlay .cn{font-size:24px;color:var(--dim);}
  #overlay button{flex:none;width:260px;background:var(--accent);box-shadow:0 6px 0 #b24f00;}
  .confetti{position:fixed;top:-20px;width:12px;height:18px;animation:fall linear forwards;pointer-events:none;z-index:20;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  @media (max-aspect-ratio:1/1){ .jack{width:clamp(70px,20vw,180px);bottom:2vh;} #cur{font-size:clamp(30px,min(8.2vw,7vh),90px);} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎃 萬聖節闖關<span class="badge">Azure 評分版</span></h1>
    <div id="mode">
      <button data-m="self">🙋 自己念</button>
      <button data-m="follow">👂 跟我念</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px"><div id="count">已過關 <b id="n">0</b> 人</div><button id="gear" aria-label="設定">⚙️</button></div>
  </header>

  <button id="needKey">🔑 還沒設定 Azure 金鑰，點這裡設定</button>
  <div id="poem">
    <div class="ptitle">HALLOWEEN</div>
    <div id="counter"></div>
    <div id="legend"><i style="color:#ffcf3b">●</i> 念到了<br><i style="color:#ff9a1f">🎃</i> 超標準　<i style="color:#c9a4ff">🔮</i> 很不錯　<i style="color:#9be34a">🧪</i> 有念到</div>
    <div id="prev"></div>
    <div id="cur"></div>
    <div id="hint"></div>
    <div id="taptip">👆 不會念的字，點一下就會念給你聽</div>
  </div>

  <div id="bar"><div id="fill"></div></div>
  <div id="status"><div id="mic"></div><div id="heard">按「開始念」就開始！</div></div>
  <div id="btns">
    <button id="demo">🔊 示範這句</button>
    <button id="start">🎤 開始念</button>
    <button id="skip">⏭ 下一句</button>
    <button id="pass">✅ 直接過關</button>
  </div>
</div>

<div id="overlay">
  <div class="big"></div>
  <div class="stars" id="stars">⭐⭐⭐⭐⭐</div>
  <div class="bonus" id="bonus">🏆 發音小達人 Super Reader! 🏆</div>
  <div class="msg" id="ovMsg">Great job!</div>
  <div class="sub" id="ovSub">You did it!</div>
  <div class="scores"><div>發音 <b id="sAcc">-</b></div><div>完整 <b id="sComp">-</b></div><div>流暢 <b id="sFlu">-</b></div></div>
  <div class="cn">念完了，去領糖果吧！</div>
  <button id="next">下一位 ▶</button>
</div>

<div id="setup">
  <h2>⚙️ Azure Speech 設定</h2>
  <label for="key">金鑰（Key 1）</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="長按 → 貼上 Azure 的金鑰 1">
  <label for="region">區域（Region）</label>
  <select id="region">
    <option value="eastasia">eastasia（東亞／香港）</option>
    <option value="japaneast">japaneast</option>
    <option value="southeastasia">southeastasia</option>
    <option value="eastus">eastus</option>
    <option value="westus2">westus2</option>
  </select>
  <div class="note">金鑰只存在這台 iPad 的 Safari 裡，不會寫進網頁檔案，也不會上傳到 GitHub。<br>和 azure.html 用同一把金鑰，設定過就不用再貼。</div>
  <div class="row"><button id="saveKey">儲存</button><button id="closeSetup">取消</button></div>
</div>

<script>
/* ================= 設定 ================= */
const SEGS = [                       // 照海報斷句，一次只出現一句
  "Ghosts and goblins, glowing giant green,",
  "Spooky spiders spinning webs",
  "that can't be seen.",
  "Giant monsters giggling behind the screen,",
  "Trick or treat! Bring out the sweet jellybean!",
  "Give me great goodies, good and supreme,",
  "Or I'll scare you running down the street with a scream!"
];
const HELP_SEC   = 6;     // 自己念模式：卡住幾秒，系統念給他聽
const AUTO_NEXT_RATIO = 0.6;  // 這句念到 6 成的字…
const AUTO_NEXT_SEC   = 1.5;  // …而且停了 1.5 秒，就自動跳下一句（辨識模糊時不會卡住）
const MAX_HELP   = 2;     // 同一句最多幫幾次，再卡就直接跳下一句
const LOOK_KEYS  = 3;     // 比對時最多往後跳幾個「重要字」（容許漏念）
const SPEAK_RATE = 0.8;   // 示範念的速度
// 小字（念不清楚也沒關係，不會擋住進度）
const STOP = new Set(["and","the","or","me","out","that","be","with","a","you","down","ill","i","to","of"]);
const CHEERS = [["Great job!","You did it!"],["Wonderful!","What a brave trick-or-treater!"],["Awesome!","You scared all the ghosts away!"],["Excellent!","Happy Halloween!"],["Fantastic!","The pumpkins are proud of you!"]];
const HELP_CHEERS = [["Great listening!","You followed so well!"],["Nice work!","You're a super echo!"],["Well done!","Happy Halloween!"]];

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(_){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}
function norm(s){return s.toLowerCase().replace(/[^a-z']/g,'').replace(/'/g,'');}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function similar(a,b){if(a===b)return true;if(a.length<5||b.length<5||Math.abs(a.length-b.length)>1)return false;return lev(a,b)<=1;}

/* ================= 字詞（整首攤平成一串） ================= */
const words=[];           // {text, token, key, seg}
const segStart=[];        // 每句第一個字的位置
SEGS.forEach((s,si)=>{segStart.push(words.length);
  s.split(' ').forEach(raw=>{const t=norm(raw);words.push({text:raw,token:t,key:!!t&&!STOP.has(t),seg:si});});});
segStart.push(words.length);
const N=words.length;
const segOf=i=>i>=N?SEGS.length:words[i].seg;

/* ================= 狀態 ================= */
let mode=lsGet('hw_mode','self');
let phase='idle';         // idle | speak | listen | done
let cursor=0;             // 下一個要念的字
let base=0;               // 這次聆聽開始時的位置
let rec=null, lastProgress=0, timer=null, shownSeg=-1;
let helps={}, helpedAny=false, listenSeg=0;
let scores=new Array(N).fill(null), scoreCur=0, fluSum=0, fluN=0, manualPass=false;
let count=parseInt(lsGet('hw_count','0'))||0; $('n').textContent=count;

/* ================= 比對：整段文字 → 念到第幾個字 ================= */
function matchFrom(start,tokens){
  let c=start;
  for(const t of tokens){
    if(c>=N) break;
    if(similar(t,words[c].token)){c++;continue;}          // 剛好是下一個字（含小字）
    let keys=0;
    for(let i=c;i<N;i++){                                  // 往後找重要字
      if(!words[i].key) continue;
      if(similar(t,words[i].token)){c=i+1;break;}
      if(++keys>=LOOK_KEYS) break;
    }
  }
  return c;
}

/* ================= 畫面 ================= */
const cur=$('cur'), prev=$('prev'), hint=$('hint');
function render(force){
  const s=Math.min(segOf(cursor),SEGS.length-1);
  if(s!==shownSeg||force){
    shownSeg=s;
    prev.innerHTML='';
    for(let p=Math.max(0,s-2);p<s;p++){const d=document.createElement('div');
      for(let i=segStart[p];i<segStart[p+1];i++){if(i>segStart[p])d.appendChild(document.createTextNode(' '));const sp=document.createElement('span');sp.className='w';sp.dataset.i=i;sp.textContent=words[i].text;d.appendChild(sp);}
      prev.appendChild(d);}
    cur.innerHTML='';
    for(let i=segStart[s];i<segStart[s+1];i++){
      if(i>segStart[s]) cur.appendChild(document.createTextNode(' '));
      const sp=document.createElement('span');sp.className='w';sp.textContent=words[i].text;sp.dataset.i=i;cur.appendChild(sp);
    }
    const ball=document.createElement('span');ball.id='ball';ball.textContent='🎃';cur.appendChild(ball);
    cur.classList.remove('enter');void cur.offsetWidth;cur.classList.add('enter');
    $('counter').textContent=`第 ${s+1} / ${SEGS.length} 句`;
  }
  paint();
  placeBall();
  $('fill').style.width=(cursor/N*100)+'%';
}
function paint(){
  document.querySelectorAll('#cur .w,#prev .w').forEach(sp=>{
    const i=+sp.dataset.i, sc=scores[i];
    sp.classList.toggle('sung',i<cursor&&sc===null);
    sp.classList.toggle('good',sc!==null&&sc>=80);
    sp.classList.toggle('ok',sc!==null&&sc>=60&&sc<80);
    sp.classList.toggle('bad',sc!==null&&sc<60);
  });
}
function placeBall(){
  const ball=$('ball'); if(!ball) return;
  const target=[...cur.querySelectorAll('.w')].find(sp=>+sp.dataset.i>=cursor);
  if(!target||phase==='idle'&&cursor===0&&false){ball.style.opacity=0;return;}
  ball.style.opacity=target?1:0;
  ball.style.left=(target.offsetLeft+target.offsetWidth/2)+'px';
  ball.style.top=(target.offsetTop+target.offsetHeight*0.12)+'px';
}
window.addEventListener('resize',()=>placeBall());
/* 點一下字 → 念出那個字 */
cur.addEventListener('click',e=>{
  const sp=e.target.closest('.w'); if(!sp) return;
  const w=words[+sp.dataset.i].text.replace(/[^A-Za-z']/g,'');
  sp.classList.remove('tap'); void sp.offsetWidth; sp.classList.add('tap');
  $('heard').textContent='🔊 '+w;
  if(phase==='listen'){                         // 念的途中點字：先暫停收音，念完字再繼續
    stopRec(); phase='speak'; setHint('🔊 '+w,'speak');
    speak(w,0.65,()=>{ if(phase==='speak'){ speak(w,0.65,()=>{ if(phase==='speak') listen(); }); } });
  } else if(phase!=='speak'){ speak(w,0.65,()=>speak(w,0.65)); }
});
function setHint(text,cls){hint.textContent=text;hint.className=cls||'';}
function setHelping(on){cur.classList.toggle('helping',on);}

/* ================= 語音合成 ================= */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Ava|Allison/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate,done){
  let fired=false; const fire=()=>{if(fired)return;fired=true;done&&done();};
  if(!('speechSynthesis' in window)){setTimeout(fire,500);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.9;if(voice)u.voice=voice;
  u.onend=fire;u.onerror=fire;
  speechSynthesis.speak(u);
  setTimeout(fire,1500+text.length*95/(rate||0.9));   // iPad 偶爾不觸發 onend，保險
}

/* ================= Azure 設定與元件 ================= */
function getCfg(){return {key:lsGet('az_key',''),region:lsGet('az_region','eastasia')};}
function refreshKeyHint(){ $('needKey').classList.toggle('show',!getCfg().key); }
function openSetup(){const c=getCfg();$('key').value=c.key;$('region').value=c.region;$('setup').classList.add('show');}
$('gear').onclick=openSetup; $('needKey').onclick=openSetup;
$('closeSetup').onclick=()=>$('setup').classList.remove('show');
$('saveKey').onclick=()=>{
  const k=$('key').value.replace(/\s+/g,'');
  if(k.length<20){alert('金鑰看起來不完整，請重新複製「金鑰 1」再貼上。');return;}
  lsSet('az_key',k); lsSet('az_region',$('region').value);
  $('setup').classList.remove('show'); refreshKeyHint(); $('heard').textContent='✅ 設定已儲存，可以開始了！';
};
let sdkReady=false;
(function loadSDK(){
  const urls=['https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js',
              'https://unpkg.com/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js'];
  let i=0;
  (function tryNext(){
    if(i>=urls.length){$('heard').textContent='❌ Azure 元件下載失敗，請確認網路後重新整理';return;}
    const sc=document.createElement('script'); sc.src=urls[i++];
    sc.onload=()=>{ if(window.SpeechSDK) sdkReady=true; else tryNext(); };
    sc.onerror=tryNext; document.head.appendChild(sc);
  })();
})();

/* ================= Azure 收音：邊聽邊亮字（KTV），一段結束再補分數 ================= */
function stopRec(delay){
  if(rec){
    const r=rec; rec=null;
    setTimeout(()=>{try{r.stopContinuousRecognitionAsync(()=>r.close(),()=>r.close());}catch(_){}} ,delay||0);
  }
  $('mic').classList.remove('on');
}
function applyScores(azWords,from){
  let c=Math.max(scoreCur,from);
  azWords.forEach(aw=>{
    const pa=aw.PronunciationAssessment||{};
    if(pa.ErrorType==='Omission') return;            // 漏念的字不算；其他（含被標成多念的）都照字比對
    const t=norm(aw.Word||''); if(!t) return;
    for(let i=c;i<Math.min(c+8,N);i++){
      if(scores[i]===null&&similar(t,words[i].token)){
        scores[i]=(typeof pa.AccuracyScore==='number')?pa.AccuracyScore:75; c=i+1; break;
      }
    }
  });
  scoreCur=c; paint();
}
function listen(){
  stopRec();
  phase='listen'; base=cursor; listenSeg=segOf(cursor); lastProgress=Date.now();
  setHelping(false);
  setHint('⏳ 連線中…','');
  const {key,region}=getCfg();
  let r;
  try{
    const cfg=SpeechSDK.SpeechConfig.fromSubscription(key,region);
    cfg.speechRecognitionLanguage='en-US';
    cfg.setProperty(SpeechSDK.PropertyId.Speech_SegmentationSilenceTimeoutMs,'800');
    r=new SpeechSDK.SpeechRecognizer(cfg,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    const ref=words.slice(cursor).map(w=>w.text).join(' ');   // 只拿「還沒念的部分」當標準答案
    new SpeechSDK.PronunciationAssessmentConfig(ref,
      SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
      SpeechSDK.PronunciationAssessmentGranularity.Word,true).applyTo(r);
  }catch(err){ $('heard').textContent='❌ 無法建立辨識：'+err; stopAll(); return; }
  rec=r;
  const myBase=base; let finals='';
  const track=text=>{
    const toks=text.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
    const c=matchFrom(myBase,toks);
    if(c>cursor) advance(c);
  };
  r.sessionStarted=()=>{ if(rec!==r) return; lastProgress=Date.now();
    setHint(mode==='follow'?'🗣️ 換你念！':'🗣️ 念出來吧！','listen'); $('mic').classList.add('on'); };
  r.recognizing=(x,e)=>{ if(rec!==r) return; const t=e.result.text||''; $('heard').textContent='🎧 '+t; track(finals+' '+t); };
  r.recognized=(x,e)=>{
    if(e.result.reason!==SpeechSDK.ResultReason.RecognizedSpeech) return;
    if(rec===r){ finals+=' '+e.result.text; track(finals); }
    try{                                          // 就算已經換句，這一段的分數也要收
      const j=JSON.parse(e.result.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult));
      const nb=j.NBest&&j.NBest[0]; if(!nb) return;
      const p=nb.PronunciationAssessment; if(p&&typeof p.FluencyScore==='number'){fluSum+=p.FluencyScore;fluN++;}
      applyScores(nb.Words||[],myBase);
    }catch(err){console.error(err);}
  };
  r.canceled=(x,e)=>{
    if(rec!==r||e.reason!==SpeechSDK.CancellationReason.Error) return;
    const d=e.errorDetails||'';
    let msg='❌ Azure 錯誤：'+d.slice(0,80);
    if(/401|unauthori|forbidden|403/i.test(d)) msg='❌ 金鑰錯誤或區域不對，請按 ⚙️ 重新設定';
    else if(/permission|notallowed|microphone/i.test(d)) msg='❌ 請允許使用麥克風（設定 → Safari → 麥克風 → 允許）';
    else if(/1006|websocket|network/i.test(d)) msg='❌ 連不到 Azure，請檢查網路';
    $('heard').textContent=msg; stopAll();
  };
  r.startContinuousRecognitionAsync(()=>{},err=>{ if(rec===r){$('heard').textContent='❌ 無法啟動：'+err;stopAll();} });
}
function advance(c){
  cursor=c; lastProgress=Date.now(); render();
  if(cursor>=N){ phase='done'; stopRec(1300); setHint('🎉 念完了！評分中…','listen'); setTimeout(()=>finish(true),1600); return; }
  if(mode==='follow' && segOf(cursor)!==listenSeg){ phase='speak'; setHint('👍 很好！','listen'); stopRec(800); setTimeout(demoThenListen,950); }
}

/* ================= 示範念一句，再換他念 ================= */
function demoThenListen(){
  if(phase==='done'||phase==='idle') return;
  stopRec(); phase='speak'; setHelping(true);
  const s=segOf(cursor);
  setHint('👂 先聽我念…','speak');
  $('heard').textContent='🔊 '+SEGS[s];
  speak(SEGS[s],SPEAK_RATE,()=>{ if(phase==='speak') listen(); });
}
function skipTo(c,msg){
  if(phase==='idle'||phase==='done') return;
  stopRec(700); if('speechSynthesis' in window) speechSynthesis.cancel();
  cursor=Math.min(c,N); lastProgress=Date.now(); render();
  if(cursor>=N){ phase='done'; setHint('🎉 念完了！','listen'); setTimeout(()=>finish(true),700); return; }
  phase='speak'; setHint(msg||'👍 下一句！','listen');
  setTimeout(()=>{ if(phase!=='speak') return; mode==='follow'?demoThenListen():listen(); },850);
}
function help(){
  const s=segOf(cursor);
  helps[s]=(helps[s]||0)+1; helpedAny=true;
  if(helps[s]>MAX_HELP){                          // 幫兩次還卡住 → 直接跳下一句
    stopRec(); cursor=segStart[s+1]; render();
    if(cursor>=N){phase='done';setTimeout(()=>finish(true),600);return;}
    setHint('沒關係，我們念下一句！','speak');
    setTimeout(()=>mode==='follow'?demoThenListen():listen(),900);
    return;
  }
  demoThenListen();
}

/* ================= 開始 / 結束 ================= */
function startAll(){
  if(!sdkReady){alert('Azure 元件還沒載入完成，請稍等幾秒或重新整理。');return;}
  if(!getCfg().key){openSetup();return;}
  resetAll();
  $('start').textContent='⏹ 念完了'; $('start').classList.add('listening');
  timer=setInterval(()=>{
    if(phase!=='listen') return;
    const s=segOf(cursor), a=segStart[s], z=segStart[s+1];
    const idle=Date.now()-lastProgress;
    if(cursor>a && (cursor-a)/(z-a)>=AUTO_NEXT_RATIO && idle>AUTO_NEXT_SEC*1000){ skipTo(z,'👍 很好！下一句'); return; }
    if(idle>HELP_SEC*1000) help();
  },400);
  if(mode==='follow'){ phase='speak'; speak('Listen and repeat after me!',0.9,demoThenListen); setHint('👂 先聽我念…','speak'); }
  else { phase='speak'; speak('Ready? Go!',0.95,listen); }
}
function stopAll(){
  phase='idle'; stopRec(); clearInterval(timer); speechSynthesis&&speechSynthesis.cancel();
  $('start').textContent='🎤 開始念'; $('start').classList.remove('listening');
}
function resetAll(){
  stopAll(); cursor=0; helps={}; helpedAny=false; shownSeg=-1; scores=new Array(N).fill(null); scoreCur=0; fluSum=0; fluN=0; render(true); setHelping(false);
  setHint(mode==='follow'?'按「開始念」，我先念一句給你聽':'按「開始念」就開始！');
}
function finish(good){
  if($('overlay').classList.contains('show')) return;
  stopAll(); phase='done';
  // 給小朋友看的分數：一律 90～100 分、五顆星；真實分數只用來決定要不要加「發音小達人」
  const sc=scores.filter(v=>v!==null);
  const comp=cursor/N, acc=sc.length?sc.reduce((x,y)=>x+y,0)/sc.length:0, flu=fluN?fluSum/fluN:0;
  const show=(v,has)=>has?Math.round(90+Math.max(0,Math.min(100,v))/10):90+Math.floor(Math.random()*4);
  const star=!manualPass && comp>=0.85 && sc.length>0 && acc>=80;
  const pool=star?[["Excellent!","Your English is amazing!"],["Perfect!","You sound like a real ghost!"],["Wonderful!","Happy Halloween, superstar!"]]:(helpedAny?HELP_CHEERS:CHEERS);
  const [a0,b]=pool[Math.floor(Math.random()*pool.length)];
  const a=a0;
  $('stars').textContent='⭐⭐⭐⭐⭐';
  $('bonus').classList.toggle('show',star);
  $('sAcc').textContent=show(acc,!manualPass&&sc.length>0);
  $('sComp').textContent=show(comp*100,!manualPass);
  $('sFlu').textContent=show(flu,!manualPass&&fluN>0);
  manualPass=false;
  $('ovMsg').textContent=a; $('ovSub').textContent=b;
  $('overlay').classList.add('show');
  count++; lsSet('hw_count',count); $('n').textContent=count;
  confetti(); if(star) setTimeout(confetti,700); speak(a+' '+b+(star?' You are a super reader!':''),0.9);
}

/* ================= 按鈕 ================= */
$('start').onclick=()=>{
  if(phase==='idle') return startAll();
  finish(cursor/N>=0.5);                                  // 念到一半按「念完了」
};
$('pass').onclick=()=>{manualPass=true;finish(true);};
$('skip').onclick=()=>{ if(phase==='idle'||phase==='done') return; skipTo(segStart[segOf(cursor)+1],'⏭ 老師幫你跳到下一句'); };
$('demo').onclick=()=>{
  if(phase==='idle'){ speak(SEGS[Math.min(segOf(cursor),SEGS.length-1)],SPEAK_RATE); return; }
  if(phase==='done') return;
  helpedAny=true; demoThenListen();
};
$('next').onclick=()=>{$('overlay').classList.remove('show');resetAll();$('heard').textContent='下一位，按「開始念」！';};
function setMode(m){
  mode=m; lsSet('hw_mode',m);
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(phase==='idle') setHint(m==='follow'?'按「開始念」，我先念一句給你聽':'按「開始念」就開始！');
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

/* ================= 南瓜燈 ================= */
const PUMPKIN='<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg"><path d="M96 34c-2-14 4-24 14-28l6 6c-8 4-11 11-10 22z" fill="#3f7d2e"/><path d="M112 14c14-8 28-4 34 6-12-2-22 0-30 6z" fill="#5aa13d"/><ellipse cx="62" cy="104" rx="52" ry="66" fill="#d9590f"/><ellipse cx="138" cy="104" rx="52" ry="66" fill="#d9590f"/><ellipse cx="100" cy="102" rx="54" ry="72" fill="#f07a16"/><ellipse cx="100" cy="102" rx="26" ry="70" fill="#ff8e2b" opacity=".55"/><path d="M48 48c-14 20-14 92 0 112M152 48c14 20 14 92 0 112" stroke="#b9470a" stroke-width="3" fill="none" opacity=".6"/><g class="face"><path d="M58 80l22-4-8 24z"/><path d="M142 80l-22-4 8 24z"/><path d="M93 104l7-12 7 12z"/><path d="M50 122c16 22 84 22 100 0l-10 6-8-8-10 10-10-9-10 9-10-10-8 8z"/></g></svg>';
['l','r'].forEach(c=>{const d=document.createElement('div');d.className='jack '+c;d.innerHTML=PUMPKIN;$('poem').appendChild(d);});
{const r=document.createElement('div');r.id='runner';r.textContent='🎃';$('bar').appendChild(r);}
{const b=document.querySelector('#overlay .big');b.className='bigjack';b.innerHTML=PUMPKIN;}
new MutationObserver(()=>{
  const p=Math.max(0,Math.min(100,parseFloat($('fill').style.width)||0));
  $('runner').style.left=p+'%';
  document.querySelectorAll('.jack').forEach(j=>{j.style.setProperty('--lit',(p/100).toFixed(2));j.classList.toggle('full',p>=70);});
}).observe($('fill'),{attributes:true,attributeFilter:['style']});
new MutationObserver(()=>{const b=document.querySelector('.bigjack');if(b&&$('overlay').classList.contains('show')){b.style.animation='none';void b.offsetWidth;b.style.animation='';}})
  .observe($('overlay'),{attributes:true,attributeFilter:['class']});

/* ================= 彩帶 ================= */
function confetti(){const colors=['#ff7a1a','#5ce07a','#a86bff','#ffd93b','#fff'];
  for(let i=0;i<90;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000);}}
/* 長按人數歸零 */
let pressT;$('count').addEventListener('touchstart',()=>{pressT=setTimeout(()=>{if(confirm('把過關人數歸零？')){count=0;lsSet('hw_count',0);$('n').textContent=0;}},1500);});
$('count').addEventListener('touchend',()=>clearTimeout(pressT));

/* ================= 啟動 ================= */
setMode(mode); resetAll(); refreshKeyHint(); if(!getCfg().key) openSetup();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>placeBall());
</script>
